name: 'Publish to BrewPage'
description: 'Publish HTML, Markdown, multi-file sites and files from CI to BrewPage and get the live URL as a step output.'
author: 'kochetkov-ma'

branding:
  icon: 'upload-cloud'
  color: 'purple'

inputs:
  path:
    description: 'File, directory, or .zip to publish.'
    required: true
  kind:
    description: 'Artefact kind: html | markdown | site | file | auto.'
    required: false
    default: 'auto'
  namespace:
    description: 'Empty (default): a per-repo namespace derived from github.repository (e.g. octo-org-my-repo), unlisted and not indexed; anyone who has the link can still open it. "public": the page is listed in the public gallery and can be indexed by Google, Bing and AI search (and appear in the sitemap), so people can discover it; a longer TTL keeps it discoverable longer (e.g. ttl-days 90 on the first publish, updates keep the original expiry). Use it for anything meant to be found or shared: docs, guides, demos, portfolios, reports, landing pages. Anyone can find and read a public page: never put secrets, tokens or personal data there. Changing the namespace starts a new publication (mode auto).'
    required: false
    default: ''
  password:
    description: 'Optional access password; protected resources are hidden from the gallery. NEW browser links stay clean and unlock through unlock.brewpage.app; password protection does not select delivery mode.'
    required: false
    default: ''
  ttl-days:
    description: 'Requested creation TTL in days (1..90), subject to account limits. PUT retains the original expiry.'
    required: false
    default: '15'
  tags:
    description: 'Comma-separated tags.'
    required: false
    default: ''
  owner-token:
    description: 'X-Owner-Token: one from an earlier run or from your profile. Empty auto-mints a token surfaced in the job summary; persist it as a secret.'
    required: false
    default: ''
  mode:
    description: 'Publish operation: auto | create | update; independent of delivery mode. auto (default) auto-republishes -- with a persisted owner-token it discovers the matching resource for this namespace+kind on https://brewpage.app and updates it (PUT), or creates one on first run. create always creates a new resource; update requires an existing resource (update-id or a discoverable one) and fails otherwise.'
    required: false
    default: 'auto'
  update-id:
    description: 'Id of an existing resource. With owner-token, explicitly updates that resource (PUT) instead of relying on auto-discovery. Takes precedence over mode auto-discovery.'
    required: false
    default: ''
  entry:
    description: 'Site entry file override (default index.html).'
    required: false
    default: ''
  show-top-bar:
    description: 'HTML only: toggle the BrewPage toolbar.'
    required: false
    default: ''
  brewpage-url:
    description: 'API base URL override. Empty uses https://brewpage.app.'
    required: false
    default: ''
  fail-on-error:
    description: 'When false, warn instead of failing the step on error.'
    required: false
    default: 'true'

outputs:
  url:
    description: 'Exact server-returned link of the published resource; existing OLD links remain unchanged.'
  owner-url:
    description: 'API/owner URL for managing the resource.'
  owner-token:
    description: 'Owner token (masked in logs). Persist to a secret to manage/redeploy the resource.'
  id:
    description: 'Resource id.'
  namespace:
    description: 'Namespace the resource was published to.'
  expires-at:
    description: 'Expiry timestamp.'

runs:
  using: 'node24'
  main: 'dist/index.js'
